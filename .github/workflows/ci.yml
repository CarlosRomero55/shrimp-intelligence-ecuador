# Integración continua: corre las pruebas unitarias (sin MySQL) en cada push y PR a main.
# Las pruebas de datos (marca "db") necesitan MySQL con los datos cargados y se corren en local.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: read              # solo lectura del repositorio

jobs:
  tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Valores FALSOS: solo para que src/config.py cargue la configuración.
    # Ninguna prueba unitaria se conecta a una base real; no hay secretos.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: ci_user
      DB_PASSWORD: ci_not_a_real_password
      API_DB_USER: ci_api_user
      API_DB_PASSWORD: ci_not_a_real_password

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pruebas unitarias (sin MySQL)
        run: python -m pytest -m "not db" -q
